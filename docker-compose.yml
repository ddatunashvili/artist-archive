services:
  app:
    build: .
    image: artist-archive:local
    ports:
      - "3000:3000"
    # Secrets and connection strings come from .env, never from this file.
    # Which local env file to load: ENV_FILE=.env.prod docker compose up
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # Keep the SQLite demo file on a volume so records survive rebuilds.
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-file:/app/data/dev.db}
      SEED_ON_START: ${SEED_ON_START:-auto}
    volumes:
      - archive-data:/app/data
    restart: unless-stopped

  # Uncomment to develop against PostgreSQL instead of SQLite. Then set, in .env:
  #   DATABASE_PROVIDER=postgresql
  #   DOCKER_DATABASE_URL=postgresql://archive:CHANGE_ME@db:5432/artist_archive?schema=public
  #   POSTGRES_PASSWORD=CHANGE_ME
  # db:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_USER: archive
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #     POSTGRES_DB: artist_archive
  #   volumes:
  #     - db-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  archive-data:
  # db-data:
